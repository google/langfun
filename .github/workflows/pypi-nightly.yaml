# This workflow builds and publishes nightly langfun builds via Google's OSS Exit Gate.

name: pypi-nightly

on:
  workflow_dispatch:
  schedule:
    # Everyday@1:00AM PST
    - cron: "0 8 * * *"

permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: '3.x'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install setuptools wheel twine keyring keyrings.google-artifactregistry-auth
        pip install -r requirements.txt
    - name: Build nightly package
      run: |
        python setup.py sdist bdist_wheel -- --nightly
    - name: Authenticate to OSS Exit Gate
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
      with:
        workload_identity_provider: 'projects/305452601764/locations/global/workloadIdentityPools/builders/providers/github'
    - name: Stage package in OSS Exit Gate Artifact Registry
      run: |
        python -m twine upload \
          --skip-existing \
          --repository-url https://us-python.pkg.dev/oss-exit-gate-prod/langfun--pypi \
          dist/*
    - name: Trigger OSS Exit Gate release
      env:
        RUN_ID: ${{ github.run_id }}
        RUN_ATTEMPT: ${{ github.run_attempt }}
      run: |
        MANIFEST_FILE="$(mktemp)"
        echo '{"publish_all": true}' > "${MANIFEST_FILE}"
        gcloud storage cp "${MANIFEST_FILE}" \
          "gs://oss-exit-gate-prod-projects-bucket/langfun/pypi/manifests/manifest-${RUN_ID}-${RUN_ATTEMPT}.json"
        rm -f "${MANIFEST_FILE}"
